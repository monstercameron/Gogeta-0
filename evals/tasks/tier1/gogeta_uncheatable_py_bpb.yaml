# Tier 1. Out-of-distribution, contamination-resistant compression: 500 Python files pushed
# to GitHub 2026-10-01..2026-10-22 (UncheatableEval-2026-10, category github_python, `content`
# column), i.e. after our data was collected. Tokenizer-independent, so comparable to public
# models scored with the SAME protocol (same window in characters; see notes/benchmark-suite.md).
task: gogeta_uncheatable_py_bpb
tag: [gogeta_tier1]
custom_dataset: !function evals.tasks.gogeta_utils.load_uncheatable
dataset_kwargs:
  snapshot: "2026-10"
  category: github_python
test_split: test
output_type: loglikelihood_rolling
doc_to_text: ""
doc_to_target: !function evals.tasks.gogeta_utils.doc_text
process_results: !function evals.tasks.gogeta_utils.process_bpb_rolling
metric_list:
  - metric: bits_per_byte
    aggregation: bits_per_byte
    higher_is_better: false
  - metric: bits_per_char
    aggregation: bits_per_byte
    higher_is_better: false
metadata:
  version: 1.0
