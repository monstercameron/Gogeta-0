# Tier 1 (execution). Held-out functional correctness, in distribution: val docs from the
# algorithmic_corpus that carry asserts + a fenced solution. Greedy, pass@1. Programs run ONLY
# in evals/sandbox.py; run_suite.py refuses this task unless the sandbox self-test passes.
task: gogeta_heldout_exec
tag: [gogeta_tier1_exec]
custom_dataset: !function evals.tasks.gogeta_utils.load_heldout_exec
test_split: test
unsafe_code: true
output_type: generate_until
doc_to_text: !function evals.tasks.gogeta_utils.doc_prompt
doc_to_target: !function evals.tasks.gogeta_utils.doc_target
process_results: !function evals.tasks.gogeta_utils.exec_native_pass1
generation_kwargs:
  until: ["```"]
  max_gen_toks: 384
  do_sample: false
metric_list:
  - metric: pass@1
    aggregation: mean
    higher_is_better: true
  - metric: frac_correct
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
