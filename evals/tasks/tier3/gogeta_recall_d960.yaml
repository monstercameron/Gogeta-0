# Tier 3. Code-native key-value recall: needle `k_xxxxx = <int>` then ~960 tokens of distractor
# assignments, then `assert k_xxxxx == `; score the value (greedy exact match + bpb).
# Distances past the SWA window (256) need the global layer / GDN state. Extend the list
# (and max_seq_len) for long-context tests.
task: gogeta_recall_d960
tag: [gogeta_tier3]
custom_dataset: !function evals.tasks.gogeta_utils.load_code_recall
dataset_kwargs:
  distance: 960
  n: 200
  seed: 0
test_split: test
output_type: loglikelihood
doc_to_text: !function evals.tasks.gogeta_utils.doc_prompt
doc_to_target: !function evals.tasks.gogeta_utils.doc_target
target_delimiter: ""
process_results: !function evals.tasks.gogeta_utils.process_recall
metric_list:
  - {metric: acc, aggregation: mean, higher_is_better: true}
  - {metric: bits_per_byte, aggregation: bits_per_byte, higher_is_better: false}
metadata:
  version: 1.0
