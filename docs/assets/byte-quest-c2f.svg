<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 930" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
<title id="t">Coarse-to-fine byte model (design concept)</title>
<desc id="d">Raw bytes enter a narrow byte encoder, are pooled into patches of P bytes, pass through an E1-style global stack that runs on patches, and are expanded back to byte positions with a one-patch causal shift: the bytes of patch k+1 read the global state of patch k. A shared-weight byte refinement loop runs r times at byte resolution with the raw bytes re-injected each pass, and a 256-way head predicts the next byte. Design concept, not a trained model.</desc>
