<text x="36" y="800" text-anchor="start" fill="#7b8494" stroke="none" font-weight="700">How to read it</text>
<text x="36" y="822" text-anchor="start" fill="#7b8494" stroke="none">• Depth goes where the information is: the heavy global stack sees only T / P patch positions.</text>
<text x="36" y="842" text-anchor="start" fill="#7b8494" stroke="none">• Iteration goes where the errors are: the cheap byte-level block is the part that loops.</text>
<text x="36" y="862" text-anchor="start" fill="#7b8494" stroke="none">• Causality: bytes of patch k + 1 see global states of patches up to k only (the one-patch shift).</text>
<text x="36" y="882" text-anchor="start" fill="#7b8494" stroke="none">• Cost figures are estimates from notes/analysis-coarse-to-fine.md. Nothing here is trained.</text>
<text x="36" y="902" text-anchor="start" fill="#7b8494" stroke="none">• Literature: bytes trail BPE below ~4B parameters on code; the arc tests granularity and loops.</text>
</g></svg>